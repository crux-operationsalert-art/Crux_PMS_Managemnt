# Writes the database's own shape back into this repository.
#
# The numbered files under build/migration are the narrative of how the
# database was built, and fifty-one of them carry no executable SQL at all.
# That is survivable while the live project exists and fatal the moment it
# does not: three separate pieces of work have already had to recover a
# function definition from the running database because it was in no file
# anywhere. This job closes that hole. It asks the database what it is and
# writes the answer to build/schema, so the repository can rebuild it.
#
# It runs here rather than from a developer's machine because this runner
# can reach Supabase and because nothing is then retyped by hand: the DDL
# that lands in the repository is the DDL the database printed.
#
# What it fetches is public.schema_snapshot(), a read-only function over the
# system catalogues. It returns no row of anybody's data — only the shape.
name: Snapshot the schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-schema.yml
      # build/migration/README.md says the rule is: write the migration, apply
      # it from the file, then regenerate the baseline. Regenerating by hand is
      # the step somebody forgets, so a migration landing here is the trigger.
      # If the migration has not been applied yet, the snapshot simply matches
      # what is there and commits nothing.
      - build/migration/*.sql

permissions:
  contents: write

concurrency:
  group: snapshot-schema
  cancel-in-progress: true

env:
  # Neither is a secret. The project ref is in every URL and the publishable
  # key identifies the project and grants nothing on its own.
  PROJECT: https://oxpwqfbtbxlvuqpztbwg.supabase.co
  ANON: sb_publishable_NvXprPt5EeNNVotu3qtOxg_mQlaiZ9z

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the database what it is
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 120 -o snap.json -w '%{http_code}' \
            -X POST \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$PROJECT/rest/v1/rpc/schema_snapshot")
          echo "HTTP $code, $(wc -c < snap.json) bytes"
          if [ "$code" != "200" ]; then
            echo "::error::The schema did not come back. HTTP $code"
            head -c 800 snap.json
            exit 1
          fi

      - name: Refuse anything that is not a schema
        run: |
          set -euo pipefail
          jq -e 'type == "object"' snap.json > /dev/null \
            || { echo "::error::Not an object."; head -c 500 snap.json; exit 1; }
          n=$(jq -r 'keys | length' snap.json)
          [ "$n" -ge 19 ] || { echo "::error::Only $n files came back; expected at least 19."; exit 1; }
          jq -e '.["09_staging.sql"] | test("create schema if not exists stg;")' snap.json > /dev/null \
            || { echo "::error::No stg schema; two of the migration views will not build."; exit 1; }
          jq -e '.["09_staging.sql"] | test("FUNCTION stg.present")' snap.json > /dev/null \
            || { echo "::error::stg came back without the normalisers those two views call."; exit 1; }
          jq -e '.["10_tables.sql"] | test("generated always as")' snap.json > /dev/null \
            || { echo "::error::plb_month_score.monthly_score came back as a default again."; exit 1; }
          jq -e '.["10_tables.sql"] | test("create table if not exists public.access_level_screen")' snap.json > /dev/null \
            || { echo "::error::No access_level_screen; the scope policy is not in the baseline."; exit 1; }
          jq -e '.["50_views.sql"] | test("kpi_registry_gap")' snap.json > /dev/null \
            || { echo "::error::No kpi_registry_gap; the registry detector is not in the baseline."; exit 1; }
          jq -e '.["10_tables.sql"] | test("create table if not exists public.person ")' snap.json > /dev/null \
            || { echo "::error::No person table in the tables file."; exit 1; }
          jq -e '.["40_functions_1.sql"] | length > 20000' snap.json > /dev/null \
            || { echo "::error::The first functions file is too small to be real."; exit 1; }
          echo "$n files."

      - name: Write them out
        run: |
          set -euo pipefail
          mkdir -p build/schema
          # Anything generated by an earlier run that this run did not produce
          # is stale by definition, so it goes. The hand-written files in this
          # directory are named 00_ and README/REGENERATE and are left alone.
          find build/schema -name '[0-9][0-9]_*.sql' ! -name '00_*' -delete
          for f in $(jq -r 'keys[]' snap.json); do
            jq -r --arg f "$f" '.[$f]' snap.json > "build/schema/$f"
            echo "  $(wc -c < "build/schema/$f") bytes  $f"
          done
          rm -f snap.json
          # The policy rows, with each value under its own column. jsonb orders
          # its keys by length, not by column, and this file came out reversed
          # once already -- a level called "Nothing is hidden from it...".
          # Checked here rather than in jq, where the apostrophes would need
          # three layers of escaping to say one thing.
          grep -q "^  ('admin', 'Administrator'," build/schema/95_access_policy.sql \
            || { echo "::error::The access policy is missing, or its values are not in column order."; exit 1; }
          grep -q "^  ('Branch Manager', 'branch')," build/schema/95_access_policy.sql \
            || { echo "::error::access_chair_level is not (chair_title, level)."; exit 1; }
          # How a month is scored travels with the baseline too (215). Without
          # the split a rebuilt Crux computes no monthly score and says nothing
          # about why, which is the failure this whole file exists to prevent.
          grep -q "'75', '25'" build/schema/95_access_policy.sql \
            || { echo "::error::The Constitution's 75/25 split is not in the policy file."; exit 1; }
          grep -q "'Outstanding'" build/schema/95_access_policy.sql \
            || { echo "::error::The appraisal bands are not in the policy file."; exit 1; }
          # It promises to carry nobody's name. A uuid in a set_by position
          # would mean the generator stopped nulling person references.
          grep -qE "^  \('[0-9a-f-]{36}', 'true', null, null, '75', '25', '[0-9-]+', null\)" \
            build/schema/95_access_policy.sql \
            || { echo "::error::The company-wide weighting row is not shaped as expected, or carries a person."; exit 1; }

      - name: Commit it if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- build/schema && [ -z "$(git status --porcelain build/schema)" ]; then
            echo "The baseline already matches the database. Nothing to commit."
            exit 0
          fi
          bytes=$(cat build/schema/[0-9][0-9]_*.sql | wc -c)
          files=$(ls build/schema/[0-9][0-9]_*.sql | wc -l)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build/schema
          git commit \
            -m "Snapshot the schema ($files files, $bytes bytes)" \
            -m "Built by .github/workflows/snapshot-schema.yml from public.schema_snapshot(). Do not edit build/schema by hand; change the database with a migration and re-run this workflow." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"

          # This job and "Publish the tool" both commit to main and each is
          # serialised only against ITSELF, so a push that touches both a
          # migration and build/app races the other job and loses. That is
          # exactly how this run failed: the baseline was built correctly
          # from the database and then thrown away by a rejected push.
          #
          # A rebase is always safe here because the two jobs write disjoint
          # files -- this one only build/schema, that one only index.html --
          # so there is nothing for a rebase to conflict over.
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto whatever landed first (attempt $try)"
            git pull --rebase --autostash origin main
            sleep $(( try * 3 ))
          done
          echo "Five pushes rejected. Something other than the sibling job is writing to main."
          exit 1
